<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1000" viewBox="0 0 900 1000" role="img"><title>Separate the jobs</title><desc>Proposed role separation. Models do not directly execute refunds.</desc><rect width="900" height="1000" fill="#020617"/><text x="45" y="64" font-family="DejaVu Sans" font-size="22" fill="#34d399">JEV / FIELD NOTES 07</text><text x="45" y="124" font-family="DejaVu Sans" font-size="40" fill="#e2e8f0">Separate the jobs</text><rect x="45" y="180" width="390" height="210" rx="20" fill="#0f172a" stroke="#22d3ee" stroke-width="3"/><text x="70" y="230" font-family="DejaVu Sans" font-size="36" fill="#22d3ee">JEV</text><text x="70" y="288" font-family="DejaVu Sans" font-size="27" fill="#e2e8f0">Narrow questions</text><text x="70" y="333" font-family="DejaVu Sans" font-size="27" fill="#e2e8f0">Intent / uncertainty</text><rect x="465" y="180" width="390" height="210" rx="20" fill="#0f172a" stroke="#a78bfa" stroke-width="3"/><text x="490" y="230" font-family="DejaVu Sans" font-size="36" fill="#a78bfa">LLM</text><text x="490" y="288" font-family="DejaVu Sans" font-size="27" fill="#e2e8f0">Draft a reply</text><text x="490" y="333" font-family="DejaVu Sans" font-size="27" fill="#e2e8f0">Use verified context</text><rect x="45" y="460" width="390" height="210" rx="20" fill="#0f172a" stroke="#34d399" stroke-width="3"/><text x="70" y="510" font-family="DejaVu Sans" font-size="36" fill="#34d399">CODE</text><text x="70" y="568" font-family="DejaVu Sans" font-size="27" fill="#e2e8f0">Check authority</text><text x="70" y="613" font-family="DejaVu Sans" font-size="27" fill="#e2e8f0">Read ledger / execute</text><rect x="465" y="460" width="390" height="210" rx="20" fill="#0f172a" stroke="#fbbf24" stroke-width="3"/><text x="490" y="510" font-family="DejaVu Sans" font-size="36" fill="#fbbf24">HUMAN</text><text x="490" y="568" font-family="DejaVu Sans" font-size="27" fill="#e2e8f0">Review exceptions</text><text x="490" y="613" font-family="DejaVu Sans" font-size="27" fill="#e2e8f0">Resolve missing facts</text><polygon points="238.0,390.0 238.0,450.0 242.0,450.0 242.0,390.0" fill="#94a3b8"/><polygon points="230.3358994113243,439.1094003924505 238.3358994113243,451.1094003924505 241.6641005886757,448.8905996075495 233.6641005886757,436.8905996075495" fill="#94a3b8"/><polygon points="241.6641005886757,451.1094003924505 249.6641005886757,439.1094003924505 246.3358994113243,436.8905996075495 238.3358994113243,448.8905996075495" fill="#94a3b8"/><polygon points="658.0,390.0 658.0,450.0 662.0,450.0 662.0,390.0" fill="#94a3b8"/><polygon points="650.3358994113244,439.1094003924505 658.3358994113244,451.1094003924505 661.6641005886756,448.8905996075495 653.6641005886756,436.8905996075495" fill="#94a3b8"/><polygon points="661.6641005886756,451.1094003924505 669.6641005886756,439.1094003924505 666.3358994113244,436.8905996075495 658.3358994113244,448.8905996075495" fill="#94a3b8"/><rect x="45" y="740" width="810" height="130" rx="20" fill="#0f172a" stroke="#fb7185" stroke-width="3"/><text x="75" y="793" font-family="DejaVu Sans" font-size="32" fill="#fb7185">Intent prediction is NOT permission.</text><text x="75" y="838" font-family="DejaVu Sans" font-size="27" fill="#e2e8f0">Refund authority stays outside the model.</text><text x="45" y="958" font-family="DejaVu Sans" font-size="20" fill="#94a3b8">Original concept illustration / CC BY 4.0</text></svg>