<desc id="desc">Orchestra Bio의 신약 개발 업무 조정 플랫폼과 OpenAI의 생명과학 모델 및 도구 Rosalind를 결합하려는 목표입니다. 통합 제품 출시 완료를 뜻하지 않습니다.</desc>
