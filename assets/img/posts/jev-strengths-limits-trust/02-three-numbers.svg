<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><title>숫자를 읽기 전에 질문을 확인한다</title><rect width="1200" height="800" fill="#020617"/><text x="60" y="85" font-family="NotoSansKR" font-size="45" fill="#e2e8f0">숫자를 읽기 전에 질문을 확인한다</text><text x="60" y="140" font-family="NotoSansKR" font-size="24" fill="#94a3b8">JEV 탐구 ④  /  설명용 개념도 · 실측 결과 아님</text><rect x="60" y="200" width="1080" height="140" rx="18" fill="#0f172a" stroke="#22d3ee" stroke-width="3"/><text x="90" y="253" font-family="NotoSansKR" font-size="37" fill="#e2e8f0">Noul  ·  예일 확률</text><text x="90" y="306" font-family="NotoSansKR" font-size="31" fill="#e2e8f0">중간 확률 ≠ 중간 정도</text><rect x="60" y="365" width="1080" height="140" rx="18" fill="#0f172a" stroke="#a78bfa" stroke-width="3"/><text x="90" y="418" font-family="NotoSansKR" font-size="37" fill="#e2e8f0">confidence  ·  분포 요약</text><text x="90" y="471" font-family="NotoSansKR" font-size="31" fill="#e2e8f0">몰린 분포 ≠ 정답 보증</text><rect x="60" y="530" width="1080" height="140" rx="18" fill="#0f172a" stroke="#34d399" stroke-width="3"/><text x="90" y="583" font-family="NotoSansKR" font-size="37" fill="#e2e8f0">Score  ·  수준의 위치</text><text x="90" y="636" font-family="NotoSansKR" font-size="31" fill="#e2e8f0">같은 평균 ≠ 같은 불확실성</text><text x="60" y="755" font-family="NotoSansKR" font-size="22" fill="#94a3b8">자체 제작 · CC BY 4.0</text></svg>