<svg xmlns="http://www.w3.org/2000/svg" width="480" height="560" viewBox="0 0 480 560" role="img" aria-labelledby="title desc">
<title id="title">야생동물 감지와 운전자 알림</title>
<desc id="desc">도로 영상에서 AI가 야생동물을 감지하면 전광판과 경광등으로 운전자에게 알리는 과정입니다. 사고 예방 효과를 입증한 도식은 아닙니다.</desc>
<rect width="480" height="560" rx="24" fill="#f1f5f9"/>
<g font-family="sans-serif" text-anchor="middle" fill="#102a43">
