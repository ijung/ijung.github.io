<rect x="36" y="383" width="408" height="90" rx="16" fill="#fef3c7"/>
<text x="240" y="439" font-size="28" font-weight="700">전광판·경광등 알림</text>
<text x="240" y="517" font-size="22">목적: 운전자 감속 유도</text>
</g>
