<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-labelledby="t d"><title id="t">Genie 4 제공 상태 비교</title><desc id="d">현재는 제한된 테스터 대상 연구 미리보기이며 Ultra 구독자와 API 조기 접근 파트너 대상 제공은 예고 단계입니다.</desc><rect width="720" height="350" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17253c"><text x="32" y="48" font-size="27" font-weight="bold">Genie 4 — 지금과 예고를 구분</text><rect x="30" y="80" width="660" height="94" rx="12" fill="#deefe7"/><text x="52" y="114" font-size="23" font-weight="bold">현재: 연구 미리보기</text><text x="52" y="150" font-size="22">제한된 신뢰 테스터 대상</text><rect x="30" y="190" width="660" height="125" rx="12" fill="#e3eafb"/><text x="52" y="225" font-size="23" font-weight="bold">예고: 이용 대상 확대</text><text x="52" y="262" font-size="21">Project Genie의 Google AI Ultra 구독자</text><text x="52" y="292" font-size="21">Gemini API·AI Studio 조기 접근 파트너</text></g></svg>