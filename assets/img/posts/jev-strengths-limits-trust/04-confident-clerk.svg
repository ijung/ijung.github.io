<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><title>자신감은 결재 도장이 아니다</title><rect width="1200" height="800" fill="#020617"/><text x="60" y="85" font-family="NotoSansKR" font-size="45" fill="#e2e8f0">자신감은 결재 도장이 아니다</text><text x="60" y="140" font-family="NotoSansKR" font-size="24" fill="#94a3b8">JEV 탐구 ④  /  설명용 개념도 · 실측 결과 아님</text><rect x="60" y="195" width="515" height="150" rx="18" fill="#0f172a" stroke="#22d3ee" stroke-width="3"/><text x="90" y="255" font-family="NotoSansKR" font-size="32" fill="#e2e8f0">&quot;저는 아주 확신합니다!&quot;</text><text x="90" y="310" font-family="NotoSansKR" font-size="26" fill="#94a3b8">모델의 판단</text><rect x="625" y="195" width="515" height="150" rx="18" fill="#0f172a" stroke="#fbbf24" stroke-width="3"/><text x="655" y="255" font-family="NotoSansKR" font-size="32" fill="#e2e8f0">&quot;결재권은 있으신가요?&quot;</text><text x="655" y="310" font-family="NotoSansKR" font-size="26" fill="#94a3b8">담당자의 확인</text><rect x="220" y="400" width="180" height="150" rx="25" fill="#164e63" stroke="#22d3ee" stroke-width="4"/><circle cx="265" cy="455" r="12" fill="#e2e8f0"/><circle cx="355" cy="455" r="12" fill="#e2e8f0"/><path d="M265 505 Q310 535 355 505" fill="none" stroke="#e2e8f0" stroke-width="5"/><circle cx="880" cy="460" r="70" fill="#78350f" stroke="#fbbf24" stroke-width="4"/><path d="M800 610 Q880 500 960 610" fill="#78350f" stroke="#fbbf24" stroke-width="4"/><text x="90" y="675" font-family="NotoSansKR" font-size="35" fill="#e2e8f0">환불 의도 예측과 환불 실행 권한은 별개입니다.</text><text x="60" y="755" font-family="NotoSansKR" font-size="22" fill="#94a3b8">자체 제작 · CC BY 4.0</text></svg>