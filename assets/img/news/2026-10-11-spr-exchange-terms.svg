<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 650" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">비축 원유 긴급 교환: 허가와 반환 조건</title><desc id="diagram-desc">최대 400만 배럴 교환 허가. ExxonMobil과 BP America 각각 최대 200만 배럴. 2027년 빌린 원유와 추가 원유 반환 의무. 실제 인도 완료를 표시한 그림이 아님.</desc><rect width="860" height="650" rx="24" fill="#f1f5f9" /><text x="430" y="60" text-anchor="middle" font-family="sans-serif" font-size="38" fill="#0f172a">비축 원유 긴급 교환</text><rect x="35" y="95" width="790" height="215" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" /><rect x="35" y="370" width="790" height="215" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" /><text x="430" y="143" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#0f172a">교환 허가 · 실제 인도 완료 아님</text><text x="430" y="198" text-anchor="middle" font-family="sans-serif" font-size="40" fill="#0f172a">총 최대 400만 배럴</text><text x="430" y="251" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#0f172a">ExxonMobil · BP America</text><text x="430" y="291" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#0f172a">각각 최대 200만 배럴</text><path d="M430 322 L430 352 M416 340 L430 354 L444 340" fill="none" stroke="#334155" stroke-width="4" /><text x="430" y="420" text-anchor="middle" font-family="sans-serif" font-size="36" fill="#0f172a">반환 의무 · 2027년</text><text x="430" y="476" text-anchor="middle" font-family="sans-serif" font-size="38" fill="#0f172a">빌린 원유 + 추가 원유</text><text x="430" y="535" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#0f172a">추가 반환 물량 규모는 미공개</text><text x="430" y="619" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#0f172a">공식 화면이 아닌 설명용 도식</text></svg>