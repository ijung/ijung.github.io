<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-labelledby="title description">
<title id="title">카카오 AI 루키 캠프 3기 모집·교육 일정</title>
<desc id="description">2026년 11월 18일 신청 마감, 12월 18일 최종 합격 발표, 2027년 1월 12일부터 15일까지 1회차, 19일부터 22일까지 2회차 교육 예정입니다. 각 회차는 50명, 3박 4일입니다.</desc>
