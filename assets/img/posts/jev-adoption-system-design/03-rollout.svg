<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1000" viewBox="0 0 900 1000" role="img"><title>Earn each rollout step</title><desc>Proposed rollout stages. At every gate, stop or return to the existing workflow if criteria fail.</desc><rect width="900" height="1000" fill="#020617"/><text x="45" y="64" font-family="DejaVu Sans" font-size="22" fill="#34d399">JEV / FIELD NOTES 07</text><text x="45" y="124" font-family="DejaVu Sans" font-size="40" fill="#e2e8f0">Earn each rollout step</text><polygon points="448.0,313.0 448.0,345.0 452.0,345.0 452.0,313.0" fill="#94a3b8"/><polygon points="440.3358994113243,334.1094003924505 448.3358994113243,346.1094003924505 451.6641005886757,343.8905996075495 443.6641005886757,331.8905996075495" fill="#94a3b8"/><polygon points="451.6641005886757,346.1094003924505 459.6641005886757,334.1094003924505 456.3358994113243,331.8905996075495 448.3358994113243,343.8905996075495" fill="#94a3b8"/><rect x="45" y="175" width="810" height="135" rx="20" fill="#0f172a" stroke="#22d3ee" stroke-width="3"/><text x="70" y="225" font-family="DejaVu Sans" font-size="30" fill="#34d399">OFFLINE CASES</text><text x="70" y="271" font-family="DejaVu Sans" font-size="28" fill="#e2e8f0">Synthetic first; define labels.</text><polygon points="448.0,488.0 448.0,520.0 452.0,520.0 452.0,488.0" fill="#94a3b8"/><polygon points="440.3358994113243,509.1094003924505 448.3358994113243,521.1094003924504 451.6641005886757,518.8905996075496 443.6641005886757,506.8905996075495" fill="#94a3b8"/><polygon points="451.6641005886757,521.1094003924504 459.6641005886757,509.1094003924505 456.3358994113243,506.8905996075495 448.3358994113243,518.8905996075496" fill="#94a3b8"/><rect x="45" y="350" width="810" height="135" rx="20" fill="#0f172a" stroke="#22d3ee" stroke-width="3"/><text x="70" y="400" font-family="DejaVu Sans" font-size="30" fill="#34d399">SHADOW</text><text x="70" y="446" font-family="DejaVu Sans" font-size="28" fill="#e2e8f0">Observe only. No live action.</text><polygon points="448.0,663.0 448.0,695.0 452.0,695.0 452.0,663.0" fill="#94a3b8"/><polygon points="440.3358994113243,684.1094003924504 448.3358994113243,696.1094003924504 451.6641005886757,693.8905996075496 443.6641005886757,681.8905996075496" fill="#94a3b8"/><polygon points="451.6641005886757,696.1094003924504 459.6641005886757,684.1094003924504 456.3358994113243,681.8905996075496 448.3358994113243,693.8905996075496" fill="#94a3b8"/><rect x="45" y="525" width="810" height="135" rx="20" fill="#0f172a" stroke="#34d399" stroke-width="3"/><text x="70" y="575" font-family="DejaVu Sans" font-size="30" fill="#34d399">LIMITED + REVIEW</text><text x="70" y="621" font-family="DejaVu Sans" font-size="28" fill="#e2e8f0">Approve scope and stop criteria.</text><rect x="45" y="700" width="810" height="135" rx="20" fill="#0f172a" stroke="#34d399" stroke-width="3"/><text x="70" y="750" font-family="DejaVu Sans" font-size="30" fill="#34d399">EXPAND ONLY IF VERIFIED</text><text x="70" y="796" font-family="DejaVu Sans" font-size="28" fill="#e2e8f0">Monitor errors and review backlog.</text><text x="70" y="900" font-family="DejaVu Sans" font-size="29" fill="#fb7185">Any failed gate: STOP / existing workflow</text><text x="45" y="958" font-family="DejaVu Sans" font-size="20" fill="#94a3b8">Original concept illustration / CC BY 4.0</text></svg>