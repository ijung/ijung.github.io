<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1000" viewBox="0 0 900 1000" role="img"><title>Choose by the task</title><desc>A proposed decision guide, not a measured ranking.</desc><rect width="900" height="1000" fill="#020617"/><text x="45" y="64" font-family="DejaVu Sans" font-size="22" fill="#34d399">JEV / FIELD NOTES 07</text><text x="45" y="124" font-family="DejaVu Sans" font-size="40" fill="#e2e8f0">Choose by the task</text><rect x="45" y="175" width="810" height="145" rx="20" fill="#0f172a" stroke="#34d399" stroke-width="3"/><text x="70" y="229" font-family="DejaVu Sans" font-size="31" fill="#34d399">Exact rule available?</text><text x="70" y="280" font-family="DejaVu Sans" font-size="29" fill="#e2e8f0">Keep it in code.</text><rect x="45" y="350" width="810" height="145" rx="20" fill="#0f172a" stroke="#22d3ee" stroke-width="3"/><text x="70" y="404" font-family="DejaVu Sans" font-size="31" fill="#22d3ee">Narrow semantic task?</text><text x="70" y="455" font-family="DejaVu Sans" font-size="29" fill="#e2e8f0">Evaluate JEV against alternatives.</text><rect x="45" y="525" width="810" height="145" rx="20" fill="#0f172a" stroke="#a78bfa" stroke-width="3"/><text x="70" y="579" font-family="DejaVu Sans" font-size="31" fill="#a78bfa">Writing or long interpretation?</text><text x="70" y="630" font-family="DejaVu Sans" font-size="29" fill="#e2e8f0">Compare your LLM workflow.</text><rect x="45" y="700" width="810" height="145" rx="20" fill="#0f172a" stroke="#fb7185" stroke-width="3"/><text x="70" y="754" font-family="DejaVu Sans" font-size="31" fill="#fb7185">No review or privacy clearance?</text><text x="70" y="805" font-family="DejaVu Sans" font-size="29" fill="#e2e8f0">HOLD. Do not enable automation.</text><text x="45" y="958" font-family="DejaVu Sans" font-size="20" fill="#94a3b8">Original concept illustration / CC BY 4.0</text></svg>