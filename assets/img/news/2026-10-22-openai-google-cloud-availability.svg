<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
<title id="title">OpenAI 모델의 Google Cloud 제공 단계</title>
<desc id="desc">2026년 10월 21일 발표 기준, 현재는 일부 기업 대상 비공개 사전 제공입니다. 정식 제공은 향후 수주 내 계획이며 날짜는 확정되지 않았습니다.</desc>
<rect width="900" height="470" rx="24" fill="#f4f6fa"/>
<g font-family="sans-serif" fill="#172536">
