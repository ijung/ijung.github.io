<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><title>높은 확신도 승인 절차를 건너뛰지 않는다</title><rect width="1200" height="800" fill="#020617"/><text x="60" y="85" font-family="NotoSansKR" font-size="45" fill="#e2e8f0">높은 확신도 승인 절차를 건너뛰지 않는다</text><text x="60" y="140" font-family="NotoSansKR" font-size="24" fill="#94a3b8">JEV 탐구 ④  /  설명용 개념도 · 실측 결과 아님</text><rect x="60" y="190" width="1080" height="105" rx="18" fill="#0f172a" stroke="#22d3ee" stroke-width="3"/><text x="90" y="255" font-family="NotoSansKR" font-size="37" fill="#e2e8f0">입력 자료 확인 + 질문별 판단 확인</text><rect x="60" y="330" width="1080" height="100" rx="18" fill="#0f172a" stroke="#fbbf24" stroke-width="3"/><text x="90" y="392" font-family="NotoSansKR" font-size="32" fill="#e2e8f0">정보 부족</text><text x="510" y="392" font-family="NotoSansKR" font-size="29" fill="#e2e8f0">→ 추가 조회·고객 질문</text><rect x="60" y="450" width="1080" height="100" rx="18" fill="#0f172a" stroke="#fb7185" stroke-width="3"/><text x="90" y="512" font-family="NotoSansKR" font-size="32" fill="#e2e8f0">낮은 확신 / 충돌</text><text x="510" y="512" font-family="NotoSansKR" font-size="29" fill="#e2e8f0">→ 사람 또는 추가 추론</text><rect x="60" y="570" width="1080" height="100" rx="18" fill="#0f172a" stroke="#34d399" stroke-width="3"/><text x="90" y="632" font-family="NotoSansKR" font-size="32" fill="#e2e8f0">높은 확신</text><text x="510" y="632" font-family="NotoSansKR" font-size="29" fill="#e2e8f0">→ 정책·권한 검사 후 허용된 처리</text><text x="60" y="755" font-family="NotoSansKR" font-size="22" fill="#94a3b8">자체 제작 · CC BY 4.0</text></svg>