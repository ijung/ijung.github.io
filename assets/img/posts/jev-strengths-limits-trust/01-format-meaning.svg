<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><title>형식 통과 ≠ 정답</title><rect width="1200" height="800" fill="#020617"/><text x="60" y="85" font-family="NotoSansKR" font-size="45" fill="#e2e8f0">형식 통과 ≠ 정답</text><text x="60" y="140" font-family="NotoSansKR" font-size="24" fill="#94a3b8">JEV 탐구 ④  /  설명용 개념도 · 실측 결과 아님</text><rect x="60" y="205" width="510" height="430" rx="18" fill="#0f172a" stroke="#fb7185" stroke-width="3"/><rect x="630" y="205" width="510" height="430" rx="18" fill="#0f172a" stroke="#34d399" stroke-width="3"/><text x="90" y="270" font-family="NotoSansKR" font-size="36" fill="#e2e8f0">형식 오류</text><text x="90" y="360" font-family="NotoSansKR" font-size="30" fill="#e2e8f0">반환: banana</text><text x="90" y="450" font-family="NotoSansKR" font-size="30" fill="#e2e8f0">허용 목록에 없는 값</text><text x="90" y="540" font-family="NotoSansKR" font-size="30" fill="#e2e8f0">→ 스키마 검사</text><text x="660" y="270" font-family="NotoSansKR" font-size="36" fill="#e2e8f0">의미 오류</text><text x="660" y="360" font-family="NotoSansKR" font-size="30" fill="#e2e8f0">반환: shipping</text><text x="660" y="450" font-family="NotoSansKR" font-size="30" fill="#e2e8f0">결제 문의를 배송팀으로</text><text x="660" y="540" font-family="NotoSansKR" font-size="30" fill="#e2e8f0">→ 정답·업무 근거 검사</text><text x="60" y="755" font-family="NotoSansKR" font-size="22" fill="#94a3b8">자체 제작 · CC BY 4.0</text></svg>