<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460"><rect width="1100" height="460" rx="24" fill="#f4f0e8"/><g font-family="DejaVu Sans, sans-serif"><text x="45" y="65" font-size="32" fill="#203044">LOWER TOKEN PRICE. SMALLER BILL?</text><text x="60" y="150" font-size="21" fill="#203044">ME</text><text x="60" y="205" font-size="33" fill="#203044">“Great, now we can save!”</text><text x="60" y="285" font-size="21" fill="#203044">AGENTS</text><text x="60" y="340" font-size="33" fill="#203044">“Shall we run more parallel tasks?”</text><text x="60" y="425" font-size="19" fill="#203044">Total cost depends on usage, retries and orchestration. Illustrative joke.</text></g></svg>