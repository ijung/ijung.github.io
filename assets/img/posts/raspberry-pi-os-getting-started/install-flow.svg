<svg xmlns="http://www.w3.org/2000/svg" width="800" height="840" viewBox="0 0 800 840" role="img" aria-labelledby="title desc">
<title id="title">Raspberry Pi OS installation flow</title><desc id="desc">Original flowchart, not the Imager user interface. Back up and check storage. Choose a compatible board and OS. Configure user, network and optional SSH. Write and verify, erasing the selected storage. Boot the Pi, update, and shut down safely.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.6"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#94a3b8"/></marker></defs>
<rect width="800" height="840" rx="16" fill="#020617"/><rect width="800" height="840" rx="16" fill="url(#grid)"/>
<g font-family="sans-serif" text-anchor="middle"><text x="400" y="48" fill="#f8fafc" font-size="32" font-weight="700">From image to first connection</text><text x="400" y="84" fill="#cbd5e1" font-size="22">Concept only · not the Imager interface</text></g>
<path d="M400 214V246M400 354V386M400 494V526M400 634V666" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="64" y="114" width="672" height="100" rx="12" fill="#4c0519" stroke="#fb7185" stroke-width="2"/><rect x="64" y="254" width="672" height="100" rx="12" fill="#083344" stroke="#22d3ee" stroke-width="2"/><rect x="64" y="394" width="672" height="100" rx="12" fill="#083344" stroke="#22d3ee" stroke-width="2"/><rect x="64" y="534" width="672" height="100" rx="12" fill="#4c0519" stroke="#fb7185" stroke-width="2"/><rect x="64" y="674" width="672" height="100" rx="12" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
<g font-family="sans-serif" text-anchor="middle" fill="#f8fafc"><text x="400" y="155" font-size="29" font-weight="700">1. BACK UP + CHECK TARGET</text><text x="400" y="191" font-size="24">Protect files before writing an image</text><text x="400" y="295" font-size="29" font-weight="700">2. CHOOSE BOARD + OS</text><text x="400" y="331" font-size="24">Check model, edition and architecture</text><text x="400" y="435" font-size="29" font-weight="700">3. CONFIGURE ACCESS</text><text x="400" y="471" font-size="24">User · network · optional SSH</text><text x="400" y="575" font-size="29" font-weight="700">4. WRITE + VERIFY</text><text x="400" y="611" font-size="24">Selected storage WILL BE ERASED</text><text x="400" y="715" font-size="29" font-weight="700">5. BOOT + CONNECT + UPDATE</text><text x="400" y="751" font-size="24">Check on real hardware · shut down safely</text><text x="400" y="815" fill="#cbd5e1" font-size="22">Original diagram · Clark · 2026-11-06</text></g>
</svg>
